<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#374151" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Fitness</title>
    <style>
      /* iOS 26 blurs the top of an installed web app unless a fixed, full-width, solid-colour
         bar (taller than 10px) sits at the top edge from the first frame. Keep this inline. */
      #top-edge {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #374151;
        z-index: 2000;
      }

      /* Wider screens show the app as a floating card, where a full-width bar looks
         detached. Matches the 431px breakpoint in App.vue. */
      @media (min-width: 431px) {
        #top-edge {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="top-edge"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
